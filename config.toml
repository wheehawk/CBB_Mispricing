# CBB Screener settings. Edit these to tune the screener; no code changes needed.
# Secrets (Odds API key, KenPom login) are NOT stored here. They go in GitHub
# repository secrets: ODDS_API_KEY, KENPOM_EMAIL, KENPOM_PASSWORD.

[thresholds]
# Which markets to screen: "spread" and/or "total". Totals are off; add "total" to turn them back on.
markets = ["spread"]
# A play is flagged only when BOTH Torvik and KenPom disagree with the market line by at
# least this many points, on the same side.
min_single_model_edge = 3.0
# Plays where both models are at or above this many points get a * in the "5+ both" column.
star_edge = 5.0
# Blended-edge minimums (the blend is the average of the two models).
spread_edge = 3.0
total_edge = 5.0
require_model_agreement = true

[model]
# Weight on each model in the blend (normalized when one is missing).
torvik_weight = 0.5
kenpom_weight = 0.5
# Home-court advantage in points, used only when KenPom projections are computed
# from public ratings (i.e. no KenPom login / FanMatch unavailable).
kenpom_hca = 3.0

[odds]
sport = "basketball_ncaab"
# Odds API bookmaker regions: "us", "us2", "uk", "eu", "au" (comma-separated).
# Each region costs extra credits per request.
regions = "us"
# Leave empty for all books in the region, or list keys like ["draftkings","fanduel"].
bookmakers = []
# Assumed price when grading units (American odds).
grading_price = -110

[display]
timezone = "America/New_York"
title = "CBB Mispricing Screener"
