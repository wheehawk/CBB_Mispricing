name: Daily screener

on:
  schedule:
    # Times are UTC. 15:17 UTC = 11:17 AM EDT / 10:17 AM EST (morning lines)
    #                22:17 UTC =  6:17 PM EDT /  5:17 PM EST (refresh before the evening slate)
    - cron: "17 15 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch: {}  # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run screener
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
        run: python -m screener.main

      - name: Save results and dashboard
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Screener update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
