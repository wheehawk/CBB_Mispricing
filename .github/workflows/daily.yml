name: Daily screener

on:
  # Main trigger: starts within seconds whenever the Torvik copy is refreshed (the Claude
  # scheduled task does that at set times). GitHub's own schedule below often runs hours late,
  # so it is only a backup in case a refresh is missed.
  push:
    branches: [main]
    paths: ["data/torvik_cache.json"]
  schedule:
    # Backup only. Times are UTC: 11:07 UTC = 6:07 AM EST / 7:07 AM EDT
    #                             23:07 UTC = 6:07 PM EST / 7:07 PM EDT
    # (Main runs: Torvik refresh at 4:45 AM and 5:15 PM Eastern -> screener starts right after.)
    - cron: "7 11 * * *"
    - cron: "7 23 * * *"
  workflow_dispatch:  # adds a "Run workflow" button on the Actions tab
    inputs:
      hours:
        description: "Hours ahead to screen (36 normally; 168 = one week, for testing)"
        default: "36"

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run screener
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KENPOM_EMAIL: ${{ secrets.KENPOM_EMAIL }}
          KENPOM_PASSWORD: ${{ secrets.KENPOM_PASSWORD }}
          LOOKAHEAD_HOURS: ${{ inputs.hours }}
        run: python -m screener.main

      - name: Save results and dashboard
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Screener update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
